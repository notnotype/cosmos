name: CI

on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: cosmos-ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    # 与 package.json 的 packageManager、docker/Dockerfile 的基础镜像保持一致
    # （三处同一个版本）。不同 bun 版本为 workspace 依赖生成的 node_modules 布局
    # 不同；Prisma CLI 的位置已不再由调用方假定（见
    # packages/storage-prisma/src/prisma-cli.ts），版本对齐用于避免布局与锁文件漂移。
    BUN_VERSION: 1.4.2

jobs:
    # 文档门禁与代码门禁拆成两个 job：这两条命令曾与代码步骤串在同一个 job 里，
    # 文档一侧失败会让 typecheck / 单测 / property / lint / build 与三个
    # needs: quality 的 E2E 全部被跳过（2026-09-15 的体积门禁与 09-17 的
    # db:validate 阻塞即此路径，见 .agents/tasks/governance/G08-ci-gate-split-status-doc/）。
    # docs 不跑 bun install：这两条命令只依赖 bun 与 python3。
    docs:
        name: Docs
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - run: bun run docs:check:ci
            - run: python3 scripts/size-governance.py -c docs --check --baseline docs/doc-governance/docs-baseline.json --fail-on-new
            # 代码类三轨门禁（字节/token/行数）。放在本 job 是因为它与文档门禁同依赖（只要 python3），
            # 不必把 quality job 拉进来。行数参数把本批限定为「只拦红线」：警戒线默认值仍是提案的
            # 400/100 行，收紧时去掉这四个参数即可。
            - run: python3 scripts/size-governance.py -c code tests --check --baseline docs/doc-governance/code-baseline.json --fail-on-new --warn-lines 800 --fail-lines 800 --entry-warn-lines 300 --entry-fail-lines 300

    quality:
        name: Quality
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - run: bun install --frozen-lockfile
            - run: bun run db:validate
            - run: bun run db:generate
            - run: bun run typecheck
            - run: bun run test
            - run: bun run test:property
            - run: bun run lint:web
            - run: bun run build

    node-e2e:
        name: Node process E2E
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: quality
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - run: bun install --frozen-lockfile
            - run: bun run db:generate
            - run: bun run test:e2e

    browser-e2e:
        name: Browser E2E
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: quality
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - run: bun install --frozen-lockfile
            - run: bun run db:generate
            - run: bunx playwright install --with-deps chromium
            - run: bun run test:browser
            - run: bun run test:browser:component-lab

    windows-smoke:
        name: Windows Node smoke
        runs-on: windows-latest
        timeout-minutes: 30
        needs: quality
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - run: bun install --frozen-lockfile
            - run: bun run db:generate
            - run: bun run build
            - shell: pwsh
              run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-node.ps1
